<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0056D2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#002d72" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <g filter="url(#shadow)">
    <!-- Cart / Scanner Graphic -->
    <rect x="96" y="110" width="320" height="200" rx="24" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Barcode lines -->
    <rect x="136" y="145" width="16" height="130" rx="4" fill="#0056D2"/>
    <rect x="168" y="145" width="8" height="130" rx="2" fill="#0056D2"/>
    <rect x="190" y="145" width="28" height="130" rx="4" fill="#0056D2"/>
    <rect x="232" y="145" width="10" height="130" rx="2" fill="#0056D2"/>
    <rect x="256" y="145" width="20" height="130" rx="4" fill="#0056D2"/>
    <rect x="290" y="145" width="12" height="130" rx="3" fill="#0056D2"/>
    <rect x="316" y="145" width="24" height="130" rx="4" fill="#0056D2"/>
    <rect x="354" y="145" width="18" height="130" rx="3" fill="#0056D2"/>
    <!-- Red laser scan line -->
    <line x1="110" y1="210" x2="402" y2="210" stroke="#FF3B30" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Text Label HB WORKS -->
  <text x="256" y="385" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">HB WORKS</text>
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="22" font-weight="600" fill="#BAE0FF" text-anchor="middle" letter-spacing="6">POINT OF SALE</text>
</svg>
